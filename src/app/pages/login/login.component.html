<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <img [src]="imgUrl + 'assets/logo/ibalogo.png'" alt="IBAESG Logo" />
    </div>

    <h2 class="login-title">FLA Admin LOGIN</h2>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      <span>{{ errorMessage }}</span>
      <button class="close-btn" (click)="errorMessage = ''">&times;</button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <input type="email" placeholder="Email Id" formControlName="email" />
      <input
        type="password"
        placeholder="Password"
        formControlName="password"
      />

      <div class="captcha-container">
        <input
          type="text"
          maxlength="6"
          placeholder="Enter captcha."
          formControlName="captcha"
        />
        <div class="captcha-value">{{ captchaValue }}</div>

        <button type="button" class="refresh-btn" (click)="loadCaptcha()">
          &#x21bb;
        </button>
      </div>

      <div class="action-row">
        <button type="submit" class="login-btn">LOGIN</button>
        <a
          *ngIf="!isProcessingForgotPassword"
          href="javascript:void(0)"
          class="forgot-password"
          (click)="onForgotPassword()"
        >
          Forgot Password?
        </a>

        <!-- Show loader/processing text when clicked -->
        <span *ngIf="isProcessingForgotPassword" class="processing-text">
          Processing...
        </span>
      </div>
    </form>
  </div>

  <footer>
    <p>&copy; {{ currentYear }} FLA Admin, All rights reserved.</p>
    <p>Powered by Web Element Solutions Limited</p>
  </footer>
</div>
