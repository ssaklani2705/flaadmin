<nav class="sidebar" [class.collapsed]="isCollapsed">
  <ul class="menu">
    <li *ngFor="let item of menuItems" [class.active-parent]="isParentActive(item)">
      <a
        href="#"
        class="menu-item"
        [class.has-children]="item.children && item.children.length > 0"
        (click)="toggleMenu(item, $event)"
        [routerLink]="!item.children?.length ? item.route : null"
        [class.active]="isSubItemActive(item)"
      >
        <i *ngIf="item.icon" [class]="item.icon"></i>&nbsp;&nbsp;
        <span *ngIf="!isCollapsed">{{ item.label }}</span>
        <i
          *ngIf="item.children && item.children.length > 0 && !isCollapsed"
          class="fa fa-angle-right arrow"
          [class.rotated]="item.expanded"
        ></i>
      </a>

      <!-- Submenu -->
      <ul *ngIf="item.expanded && !isCollapsed" class="submenu">
        <li *ngFor="let subItem of item.children">
          <a
            href="#"
            class="menu-item"
            (click)="toggleMenu(subItem, $event)"
            [routerLink]="!subItem.children?.length ? subItem.route : null"
            [class.active]="isSubItemActive(subItem)"
          >
            {{ subItem.label }}
            <i
              *ngIf="subItem.children && subItem.children.length > 0"
              class="fa fa-angle-right arrow"
              [class.rotated]="subItem.expanded"
            ></i>
          </a>

          <!-- Sub-submenu -->
          <ul *ngIf="subItem.expanded" class="submenu">
            <li *ngFor="let child of subItem.children">
              <a
                [routerLink]="child.route"
                [class.active]="isSubItemActive(child)"
              >
                {{ child.label }}
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>
</nav>
