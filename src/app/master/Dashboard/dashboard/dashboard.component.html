<div class="container">
  <div class="row">
    @for (stat of stats; track stat.label) {
      <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
        <a class="dashboard-stat dashboard-stat-v2" [ngClass]="stat.bgClass" [routerLink]="stat.link">
          <div class="visual">
            <i [class]="stat.icon"></i>
          </div>
          <div class="details">
            <div class="number">
              <span [appCounter]="stat.value">{{ stat.value }}</span>
            </div>
            <div class="desc">{{ stat.label }}</div>
          </div>
        </a>
      </div>
    }
  </div>
</div>
