<div class="view-user-container">
        <div class="user-header">
      <h2 class="section-title">VIEW GALLERY</h2>
      <div class="action-buttons">
        <button mat-raised-button color="accent" class="btn-back" (click)="backToIndexPage()">
          Back to Index
        </button>
      </div>
    </div>
  <div class="gallery-layout">
    
    <!-- LEFT COLUMN: All Fields -->
    <div class="gallery-details">
      <!-- Type -->
      <div class="detail-row">
        <label class="section-label">Type</label>
        <span *ngIf="gallery.type === 1">Image</span>
        <span *ngIf="gallery.type === 2">Video</span>
      </div>

      <!-- Caption -->
      <div class="detail-row">
        <label class="section-label">Caption</label>
        <div class="caption-box">{{ gallery.caption }}</div>
      </div>

      <!-- Status -->
      <div class="detail-row">
        <label class="section-label">Status</label>
        <!-- <span [ngClass]="gallery.status === 1 ? 'status-active' : 'status-inactive'">
          {{ gallery.status === 1 ? 'Active' : 'Inactive' }}
        </span> -->
         <span style="width: 10px;" [ngClass]="common.getStatusClass(gallery.status)">
          {{ common.getStatusLabel(gallery.status) }}
        </span>
      </div>

      <!-- Registered Date -->
      <div class="detail-row">
        <label class="section-label">Registered Date</label>
        <div class="caption-box">
          {{ gallery.regDate | date:'dd-MMM-yyyy hh:mm a' }}
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Preview -->
    <div class="gallery-preview">
      <!-- <label class="section-label">Preview</label> -->

      <!-- Image Preview -->
      <img
        *ngIf="gallery.type === 1"
        [src]="gallery.imageUrl"
        alt="Gallery Image"
        class="preview-media"
      />

      <!-- Video Preview -->
      <iframe
        *ngIf="gallery.type === 2"
        [src]="gallery.videoUrl | safeUrl"
        frameborder="0"
        allowfullscreen
        class="preview-media"
      ></iframe>
    </div>
  </div>

  
</div>


 <mat-card class="action-history-card">
  <mat-card-header>
    <mat-card-title class="section-title action-title">ACTION HISTORY</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="transactionhistory?.length === 0" class="no-records-box">
      No record(s) found.
    </div>

    <div *ngIf="hasTransactionHistory" class="table-container">
      <table mat-table [dataSource]="transactionhistory" class="mat-elevation-z1" matSort>

        <!-- Performed By Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Performed By </th>
          <td mat-cell *matCellDef="let record"> {{ record.name }} </td>
        </ng-container>

        <!-- Date & Time Column -->
        <ng-container matColumnDef="entryDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Date & Time </th>
          <td mat-cell *matCellDef="let record"> {{ record.entryDate }} </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
          <td mat-cell *matCellDef="let record"> {{ record.action }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['name','entryDate','action']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name','entryDate','action'];"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
