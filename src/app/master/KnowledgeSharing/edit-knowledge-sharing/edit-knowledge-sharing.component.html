<form #galleryForm="ngForm" (ngSubmit)="onSubmit(galleryForm)" novalidate>
  <div class="view-user-container">
    <div class="user-header">
      <h2 class="section-title">EDIT KNOWLEDGE SHARING</h2>
      <div class="action-buttons">
        <button mat-raised-button color="accent" class="btn-back" (click)="backToIndexPage()">
          Back to Index
        </button>
      </div>
    </div>

    <!-- ROW 1: Title + Source (Left) | Preview (Right) -->
    <div class="user-info" style="display: flex; gap: 24px; align-items: flex-start;">
      
      <!-- Left Column: Title + Source -->
      <div class="user-column" style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
        <!-- Title -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput [(ngModel)]="Knowledge.title" name="title" required maxlength="1000" #titleCtrl="ngModel" placeholder="Enter Title" />
        </mat-form-field>
        <div class="error" *ngIf="titleCtrl.invalid && titleCtrl.touched">
          <div *ngIf="titleCtrl.errors?.['required']">Title is required.</div>
          <div *ngIf="titleCtrl.errors?.['maxlength']">Maximum 1000 characters allowed.</div>
        </div>

        <!-- Source -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Source</mat-label>
          <input matInput [(ngModel)]="Knowledge.source" name="source" maxlength="1000" #sourceCtrl="ngModel" placeholder="Enter Source" />
        </mat-form-field>
        <div class="error" *ngIf="sourceCtrl.invalid && sourceCtrl.touched">
          <!-- <div *ngIf="sourceCtrl.errors?.['required']">Source is required.</div> -->
          <div *ngIf="sourceCtrl.errors?.['maxlength']">Maximum 1000 characters allowed.</div>
        </div>


        
      <div class="user-column full-width">
        <label for="file">Upload File 
          <small class="file-info">[Only .jpg, .jpeg, .png, .pdf allowed up to 10 MB]</small>
        </label>
        <input #fileInput type="file" name="file" (change)="onFileSelected($event)" accept=".jpg,.jpeg,.png,.pdf" required 
               style="height: 48px; width: 100%; margin-top: 4px;" />
        <div class="error" *ngIf="fileError">{{ fileError }}</div>
      </div>


 

        <mat-form-field appearance="outline" class="field">
    <mat-label>Select Date</mat-label>
    <input matInput [matDatepicker]="picker" [(ngModel)]="Knowledge.date" name="date" required 
      placeholder="DD-MM-YYYY" readonly #dateCtrl="ngModel" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-error *ngIf="dateCtrl.invalid && dateCtrl.touched">Date is required.</mat-error>
  </mat-form-field>
 


      <!-- Status Dropdown -->
<mat-form-field appearance="outline" class="full-width">
  <mat-label>Status</mat-label>
  <mat-select [(ngModel)]="Knowledge.status" name="status" required #statusCtrl="ngModel">
    <mat-option [value]="1">Active</mat-option>
    <mat-option [value]="2">Inactive</mat-option>
  </mat-select>
  <mat-error *ngIf="statusCtrl.invalid && statusCtrl.touched">
    Status is required.
  </mat-error>
</mat-form-field>
    
      </div>

      <!-- Right Column: Preview -->

<div class="gallery-preview" style="flex: 1;">
  <label class="section-label">Preview</label>
  <div *ngIf="Knowledge?.url">
    <!-- Image Preview -->
    <img *ngIf="Knowledge.type === 'image'" [src]="Knowledge.url" [alt]="Knowledge.caption" class="preview-media" 
         style="max-height: 500px; width: 100%;" />

    <!-- PDF Preview -->
    <iframe *ngIf="Knowledge.type === 'pdf'" [src]="Knowledge.url | safeUrl" width="100%" height="500px"></iframe>

    <!-- <p>{{ Knowledge.caption }}</p> -->
  </div>

  <div *ngIf="!Knowledge?.url">
    <p>No file selected</p>
  </div>
</div>


    </div>

   

    <!-- ACTION BUTTONS -->
    <div class="form-actions" style="margin-top: 24px;">
      <button mat-raised-button color="primary" type="submit" [disabled]="galleryForm.invalid">
        Submit
      </button>
      <button mat-stroked-button color="warn" type="button" (click)="onReset()">
        Reset
      </button>
    </div>

  </div>
</form>
